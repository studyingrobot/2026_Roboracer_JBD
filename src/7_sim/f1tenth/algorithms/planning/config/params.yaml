waypoint_planner_node:
  ros__parameters:
    # Selected by planning.launch.py; no simulator or map-specific source path.
    waypoint_csv: ""
    path_topic: "/planning/global_path"
    marker_topic: "/planning/markers"
    frame_id: "map"
    publish_rate: 2.0

local_obstacle_planner_node:
  ros__parameters:
    global_path_topic: "/planning/global_path"
    local_path_topic: "/planning/path"
    scan_topic: "/scan"
    map_topic: "/map"
    odom_topic: "/ego_racecar/odom"
    emergency_stop_topic: "/safety/emergency_stop"
    avoidance_active_topic: "/planning/avoidance_active"
    marker_topic: "/planning/local_markers"
    status_topic: "/planning/local_status"
    global_frame_id: "map"
    odom_frame_id: "odom"
    base_frame_id: "ego_racecar/base_link"
    # /scan is 40 Hz and /odom is 50 Hz on the current car. Planning at
    # 20 Hz halves avoidance latency without processing every laser packet.
    planning_rate: 20.0
    scan_process_rate: 20.0
    scan_transform_delay: 0.08

    detection_range: 6.0
    map_endpoint_clearance: 0.30
    # 장애물 간 최소 거리가 1.0 m 로 보장되므로, 하나를 둘로 쪼개지
    # 않을 만큼 키워도 둘이 하나로 붙지 않는다.
    cluster_gap: 0.35
    cluster_min_points: 8
    # 0.5 x 0.5 m 를 45도에서 보면 폭이 대각선 0.707 m 까지 보인다.
    # 1.0 m 미만이라 두 장애물이 한 클러스터로 승인되는 일은 없다.
    cluster_max_diameter: 0.80
    # 차 반폭 0.17 + 장애물 반경 0.36 = 0.53 에 여유를 더한 값.
    path_obstacle_corridor: 0.90
    obstacle_memory_seconds: 0.8
    obstacle_confirmation_frames: 2
    # 최소 장애물 간격 1.0 m 의 절반 미만이어야 서로 오매칭되지 않는다.
    obstacle_match_distance: 0.45
    # 대회 고정 장애물은 0.5 x 0.5 m 미만. LiDAR 는 앞면만 보므로
    # 관측 반경을 그대로 믿으면 과소평가된다.
    #   default = 0.5 의 절반. 멀어서 점이 적을 때 쓰는 하한.
    #   max     = 0.5 x 0.5 의 외접원 반경 0.354 에 맞춘 상한.
    obstacle_default_radius: 0.25
    obstacle_max_radius: 0.36
    obstacle_marker_radius_scale: 1.0
    obstacle_lookahead: 3.2
    # Speed-adaptive horizon = reaction + v^2/(2a) + margin, bounded here.
    maximum_planning_horizon: 6.0
    planning_reaction_time: 0.25
    planning_deceleration: 4.0
    planning_distance_margin: 0.50

    # Frenet pass candidates are generated from the measured obstacle radius
    # and lateral position. No track-specific obstacle coordinates are used.
    candidate_offset_spacing: 0.04
    candidate_offset_count: 6
    # 필요 횡클리어런스 = 0.17(차) + 0.36(장애물) + 0.02 + 0.05 = 0.60.
    # 후보는 맵 여유로 다시 검증되므로 상한을 키워도 벽으로 가지 않는다.
    maximum_candidate_offset: 1.10
    # Small allowance for scan-surface centroid and real tracking error. This
    # affects path clearance, not the visualized obstacle size or AEB range.
    candidate_clearance_buffer: 0.05
    avoidance_before_distance: 1.80
    avoidance_after_distance: 1.10
    maximum_avoidance_before_distance: 4.0
    maximum_avoidance_after_distance: 2.0
    avoidance_before_time: 0.75
    avoidance_after_time: 0.40
    path_sample_spacing: 0.04
    # 0.17 m vehicle lateral radius + 0.02 m wall margin.
    map_clearance: 0.19
    vehicle_clearance_radius: 0.17
    obstacle_safety_margin: 0.02

    # Conservative real-vehicle AEB baseline. Keep these independent from the
    # RViz marker size and tune only from measured braking data.
    aeb_corridor_half_width: 0.19
    aeb_reaction_time: 0.12
    aeb_max_deceleration: 4.0
    aeb_min_distance: 0.16
    aeb_critical_reaction_time: 0.05
    aeb_confirmation_frames: 2
    scan_timeout: 0.50

    # The controller takes this topic as a limit, not as a fixed avoidance
    # speed. Straights remain fast while curvature sets a physically meaningful
    # limit through a_y = v^2*kappa.
    maximum_planning_speed: 5.5
    minimum_avoidance_speed: 0.60
    max_lateral_acceleration: 1.50
    candidate_curvature_weight: 0.35
    candidate_clearance_weight: 0.10
    curvature_percentile: 85.0
